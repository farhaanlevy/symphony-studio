name: release-gate

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize, ready_for_review]
  merge_group:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: release-gate-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: release-gate evidence (untrusted Actions producer)
    if: >-
      github.event_name == 'merge_group' ||
      github.event.pull_request.head.ref == 'release/v0.1.0'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_SHA }}

      - name: Verify exact checkout and workflow boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git status --porcelain=v1 --untracked-files=all)" = ""
          git diff --exit-code 4cbe3a9699a73b862466c0b157ceca0c1985d6d7 -- SPEC.md
          git remote add upstream https://github.com/openai/symphony.git
          git remote set-url --push upstream DISABLED

      - name: Set up mise tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true
          sha256: d31578a16ae2708385249b439c95533068e04b9507a118e905aa6768905671fc
          version: 2026.7.11
          working_directory: elixir

      - name: Verify release tooling
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m py_compile scripts/release/release.py scripts/release/test_release.py
          python3 scripts/release/test_release.py -v
          git diff --check
          test "$(git status --porcelain=v1 --untracked-files=all)" = ""

      - name: Install exact Codex compatibility pin
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --prefix "$RUNNER_TEMP/codex-pin" @openai/codex@0.144.3
          printf '%s\n' "$RUNNER_TEMP/codex-pin/bin" >> "$GITHUB_PATH"
          test "$("$RUNNER_TEMP/codex-pin/bin/codex" --version)" = "codex-cli 0.144.3"

      - name: Verify accepted foundation and current installed schema binding
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: |
          set -euo pipefail
          foundation=25f4d78e1eb3102dd8d1aa72413988b36b72fd71
          git merge-base --is-ancestor "$foundation" HEAD
          git diff --exit-code "$foundation" -- \
            artifacts/readiness/implementation-readiness.json \
            elixir/priv/codex_schema/0.144.3/manifest.json
          foundation_tree="$RUNNER_TEMP/r0-06-foundation"
          cleanup() {
            git worktree remove --force "$foundation_tree" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          git worktree add --detach "$foundation_tree" "$foundation"
          (
            cd "$foundation_tree"
            python3 scripts/studio_readiness.py verify \
              --readiness artifacts/readiness/implementation-readiness.json
          )
          cleanup
          trap - EXIT
          python3 scripts/codex_schema.py verify-source-bound-prepublication

      - name: Emit exact-head release-gate receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/release-gate-test-evidence.json" "$RELEASE_SHA" "$(git rev-parse 'HEAD^{tree}')" <<'PY'
          import json
          from pathlib import Path
          import sys

          output, head, tree = sys.argv[1:]
          value = {
              "blockingFindings": [],
              "exactHead": head,
              "exactTree": tree,
              "id": "r0-07-release-specific-gate",
              "kind": "test-evidence",
              "status": "pass",
          }
          Path(output).write_text(
              json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload public release-gate receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-gate-${{ env.RELEASE_SHA }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/release-gate-test-evidence.json
